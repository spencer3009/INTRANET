        <title>INTRANET PARA COLEGIOS - PLATAFORMA DE GESTIÓN EDUCATIVA</title>

        <!--
        These two scripts have been added for the Visual Edits, please do not edit or remove them
        -->
        <script>
            // Only load visual edit scripts when inside an iframe
            if (window.self !== window.top) {
                // Load debug monitor script
                var debugMonitorScript = document.createElement('script');
                debugMonitorScript.src = 'https://assets.emergent.sh/scripts/debug-monitor.js';
                document.head.appendChild(debugMonitorScript);

                // Configure Tailwind
                window.tailwind = window.tailwind || {};
                tailwind.config = {
                    corePlugins: { preflight: false },
                };

                // Load Tailwind CDN

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>

        <!-- WebView Detection: redirect to Chrome if opened from WhatsApp/Facebook/Instagram -->
        <div id="webview-blocker" style="display:none;position:fixed;inset:0;z-index:99999;background:#0B2C5F;font-family:'Inter',system-ui,sans-serif;">
          <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
            <img src="%PUBLIC_URL%/icons/icon-192.png" alt="EduNet" style="width:96px;height:96px;border-radius:20px;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.3);" />
            <h1 style="color:#fff;font-size:26px;font-weight:700;margin:0 0 12px;">Instala la App EduNet</h1>
            <p style="color:rgba(255,255,255,0.75);font-size:15px;line-height:1.5;margin:0 0 32px;max-width:320px;">Para instalar la App EduNet debes abrir esta p&aacute;gina en tu navegador.</p>
            <a id="webview-open-chrome" href="#" style="display:inline-flex;align-items:center;gap:8px;background:#3B82F6;color:#fff;font-size:16px;font-weight:600;padding:16px 40px;border-radius:14px;text-decoration:none;box-shadow:0 4px 16px rgba(59,130,246,0.4);transition:transform 0.15s;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Abrir en Chrome
            </a>
            <div style="margin-top:36px;background:rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;max-width:320px;">
              <p style="color:rgba(255,255,255,0.55);font-size:13px;margin:0 0 8px;font-weight:600;">Si el bot&oacute;n no funciona:</p>
              <p style="color:rgba(255,255,255,0.45);font-size:13px;line-height:1.6;margin:0;">
                1. Presiona el men&uacute; &#8942; arriba a la derecha<br/>
                2. Toca <strong style="color:rgba(255,255,255,0.65);">&ldquo;Abrir en navegador&rdquo;</strong>
              </p>
            </div>
          </div>
        </div>
        <script>
          (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera || '';
            var isWebView = /FBAN|FBAV|Instagram|WhatsApp|Messenger|MicroMessenger|Line\//i.test(ua) || /\bwv\b/.test(ua);
            var isSamsungInternet = /SamsungBrowser/i.test(ua);
            var isAndroidAppReferrer = document.referrer && document.referrer.indexOf('android-app://') !== -1;
            var isExternalApp = isWebView || isSamsungInternet || isAndroidAppReferrer;
            if (isExternalApp) {
              var blocker = document.getElementById('webview-blocker');
              blocker.style.display = 'block';
              var root = document.getElementById('root');
              if (root) root.style.display = 'none';
              var url = window.location.href;
              var btn = document.getElementById('webview-open-chrome');
              btn.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
              btn.addEventListener('click', function() {
                setTimeout(function() {
                  window.location.href = url;
                }, 2000);
              });
            }
          })();
        </script>

        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
       
        <script>
          // 1. Capture beforeinstallprompt EARLY before React mounts
          window.__pwaInstallPrompt = null;
          window.__pwaInstallPromptFired = false;
          window.__swControlling = false;
          window.__swReady = null;

          window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__pwaInstallPrompt = e;
            window.__pwaInstallPromptFired = true;
            console.log('[PWA-GLOBAL] beforeinstallprompt CAPTURADO');
            console.log('[PWA-GLOBAL] platforms:', e.platforms);
          });

          window.addEventListener('appinstalled', function() {
            console.log('[PWA-GLOBAL] APP INSTALADA exitosamente');
            window.__pwaInstalled = true;
            var root = document.getElementById('root');
            root.innerHTML = '<div id="pwa-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0B2C5F;text-align:center;padding:24px;font-family:Inter,system-ui,sans-serif;">'
              + '<style>@keyframes pwaSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>'
              + '<img src="/icons/icon-192.png" alt="EduNet" style="width:80px;height:80px;border-radius:18px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,0.3);" />'
              + '<h2 id="pwa-title" style="color:#fff;font-size:22px;font-weight:700;margin:0 0 8px;">Instalando EduNet\u2026</h2>'
              + '<p id="pwa-text" style="color:rgba(255,255,255,0.6);font-size:14px;margin:0 0 24px;">Preparando la aplicaci\u00f3n en tu dispositivo</p>'
              + '<div id="pwa-progress" style="width:240px;height:8px;background:rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;">'
              + '<div id="pwa-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#3B82F6,#22c55e);border-radius:6px;transition:width .15s linear;"></div>'
              + '</div>'
              + '<div id="pwa-spinner" style="margin-top:20px;width:28px;height:28px;border:3px solid rgba(255,255,255,0.15);border-top:3px solid #fff;border-radius:50%;animation:pwaSpin 1s linear infinite;"></div>'
              + '</div>';
            var progress = 0;
            var iv = setInterval(function() {
              progress += 1.43;
              if (progress > 100) progress = 100;
              var bar = document.getElementById('pwa-bar');
              if (bar) bar.style.width = progress + '%';
              if (progress >= 100) {
                clearInterval(iv);
                setTimeout(function() {
                  var screen = document.getElementById('pwa-screen');
                  if (!screen) return;
                  screen.innerHTML = '<div style="width:80px;height:80px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 40px rgba(34,197,94,0.4);">'
                    + '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                    + '</div>'
                    + '<h2 style="color:#fff;font-size:24px;font-weight:700;margin:0 0 16px;">EduNet se instal\u00f3 correctamente</h2>'
                    + '<p style="color:rgba(255,255,255,0.65);font-size:15px;line-height:1.6;margin:0 0 32px;max-width:300px;">La aplicaci\u00f3n ya est\u00e1 disponible en tu dispositivo.</p>'
                    + '<div style="background:rgba(255,255,255,0.08);border-radius:14px;padding:20px 24px;max-width:300px;">'
                    + '<p style="color:rgba(255,255,255,0.85);font-size:14px;line-height:1.6;margin:0;">Busca el \u00edcono <strong style="color:#fff;">\u201cEduNet\u201d</strong> en la pantalla principal de tu celular y \u00e1brelo desde all\u00ed.</p>'
                    + '</div>';
                }, 500);
              }
            }, 100);
          });

          // 2. Register Service Worker IMMEDIATELY (not on load)
          if ('serviceWorker' in navigator) {
            console.log('[SW] Registrando Service Worker...');
            console.log('[SW] controller actual:', navigator.serviceWorker.controller);

            // Create a promise that resolves when SW controls the page
            window.__swReady = new Promise(function(resolve) {
              if (navigator.serviceWorker.controller) {
                console.log('[SW] Ya hay un controller activo:', navigator.serviceWorker.controller.scriptURL);
                window.__swControlling = true;
                resolve(true);
                return;
              }

              // Wait for controllerchange event (fires after claim())
              navigator.serviceWorker.addEventListener('controllerchange', function() {
                console.log('[SW] controllerchange - SW ahora controla la pagina');
                console.log('[SW] nuevo controller:', navigator.serviceWorker.controller);
                window.__swControlling = true;
                resolve(true);
              });

              // Timeout after 10s
              setTimeout(function() {
                if (!window.__swControlling) {
                  console.warn('[SW] Timeout 10s - SW no controla la pagina');
                  console.warn('[SW] controller:', navigator.serviceWorker.controller);
                  resolve(false);
                }
              }, 10000);
            });

            navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
              .then(function(reg) {
                console.log('[SW] Registrado. Scope:', reg.scope);
                console.log('[SW] installing:', !!reg.installing);
                console.log('[SW] waiting:', !!reg.waiting);
                console.log('[SW] active:', !!reg.active, reg.active ? reg.active.state : '');

                // If there's a waiting SW, activate it
                if (reg.waiting) {
                  console.log('[SW] Hay un SW en espera, enviando skipWaiting...');
                  reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                }

                // Watch for new SW installing
                reg.addEventListener('updatefound', function() {
                  var newSW = reg.installing;
                  console.log('[SW] Update found, nuevo SW instalando...');
                  if (newSW) {
                    newSW.addEventListener('statechange', function() {
                      console.log('[SW] Estado del nuevo SW:', newSW.state);
                      if (newSW.state === 'activated') {
                        console.log('[SW] Nuevo SW activado');
                      }
                    });
                  }
                });
              })
              .catch(function(err) {
                console.error('[SW] ERROR al registrar:', err);
              });
          } else {
            console.error('[SW] Service Worker NO soportado en este navegador');
          }
        </script>
    </body>
</html>
